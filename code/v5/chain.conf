# chain.conf -- read by the monitor

# Interface the monitor attaches XDP + AF_XDP to.
iface wlp0s20f3

# Only packets with THIS SOURCE PORT are steered into the chain
# 0 = steer everything.
port 0

# What happens after the last NF:
#   stack -> re-inject the packet into the kernel (via a TAP device)
#   drop  -> just recycle the frame (the client will never see the packet)
sink drop

# The chain, in order: NIC -> first -> ... -> last -> sink.
# To add an NF, write nfX.c and append its name here.
chain nf1 nf2 nf3
